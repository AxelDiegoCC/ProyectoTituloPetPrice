<ion-header [translucent]="true">
  <ion-toolbar class="colorPri icon toolbar-flex">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin-panel"></ion-back-button>
    </ion-buttons>
    <div class="title-container">
      <ion-title>Productos</ion-title>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-searchbar
    placeholder="Buscar por nombre o marca"
    [(ngModel)]="search"
    (ionInput)="onSearch()">
  </ion-searchbar>

  <ion-list inset="true">
    <ion-item-sliding *ngFor="let p of products; let i = index">
      <ion-item lines="none">
        <ion-thumbnail slot="start">
          <img [src]="p.imagen" />
        </ion-thumbnail>

        <ion-label>
          <h3>{{ p.nombre }}</h3>
          <p>Marca: {{ p.marca || '—' }}</p>
          <ion-note>Precio: ${{ p.precio_minimo | number:'1.0-0' }}</ion-note>
        </ion-label>
      </ion-item>

      <ion-item-options side="end">
        <!-- Editar producto con AlertController -->
        <ion-item-option (click)="editProduct(p)" expandable
          style="display: flex; justify-content: center; align-items: center; background: transparent;">
          <ion-button fill="solid" color="primary" shape="round" size="small">
            <ion-icon name="create-outline"></ion-icon>
          </ion-button>
        </ion-item-option>

        <ion-item-option (click)="confirmDeleteProduct(p)" expandable
          style="display: flex; justify-content: center; align-items: center; background: transparent;">
          <ion-button fill="solid" color="danger" shape="round" size="small">
            <ion-icon name="trash-outline"></ion-icon>
          </ion-button>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>
</ion-content>

<!-- FAB para agregar producto (abre modal) -->
<ion-fab vertical="bottom" horizontal="end" slot="fixed" style="bottom: 100px; right: 18px;">
  <ion-fab-button size="small" color="primary" (click)="openAddProductModal()">
    <ion-icon name="person-add-outline"></ion-icon>
  </ion-fab-button>
</ion-fab>

<!-- Modal agregar producto -->
<ion-modal [isOpen]="productModalOpen" (didDismiss)="closeProductModal()" [breakpoints]="[0, 0.4, 0.98]"
  initialBreakpoint="0.4"
  backdropDismiss="true"
  style="--height: 90%; --top: 98%;">
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-title>Agregar Producto</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="closeProductModal()">Cerrar</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content class="ion-padding">
      <ion-item>
        <ion-label position="floating">Nombre</ion-label>
        <ion-input [(ngModel)]="currentProduct.nombre"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Marca</ion-label>
        <ion-input [(ngModel)]="currentProduct.marca"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Precio</ion-label>
        <ion-input type="number" [(ngModel)]="currentProduct.precio_minimo" (ionChange)="onPrecioChange($event)"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Descripción</ion-label>
        <ion-textarea [(ngModel)]="currentProduct.descripcion"></ion-textarea>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Tienda</ion-label>
        <ion-input [(ngModel)]="currentProduct.tienda_mas_barata"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">URL Imagen</ion-label>
        <ion-input [(ngModel)]="currentProduct.imagen"></ion-input>
      </ion-item>

      <ion-button expand="block" class="colorPri" (click)="saveProduct()">
        Agregar producto
      </ion-button>
    </ion-content>
  </ng-template>
</ion-modal>

<ion-footer [translucent]="true" class="footer-fixed">
  <ion-segment [value]="activeTab">
    <ion-segment-button value="search" (click)="goToProducts()">
      <ion-label>Buscar</ion-label>
      <ion-icon name="search-outline"></ion-icon>
    </ion-segment-button>
    <ion-segment-button value="favorites" (click)="goToFavorites()">
      <ion-label>Favoritos</ion-label>
      <ion-icon name="star-outline"></ion-icon>
    </ion-segment-button>
    <ion-segment-button value="profile" (click)="goToProfile()">
      <ion-label>Perfil</ion-label>
      <ion-icon name="person-outline"></ion-icon>
    </ion-segment-button>
  </ion-segment>
</ion-footer>
