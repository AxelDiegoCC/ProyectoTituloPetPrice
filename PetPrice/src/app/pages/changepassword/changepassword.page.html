<ion-header [translucent]="true">
  <ion-toolbar class="colorPri icon toolbar-flex">
    <div class="title-container">
      <ion-title>Recuperar Contraseña</ion-title>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="icon ion-padding">

  <div class="baseLabel">
    <ion-label>
      <h1 class="title">Pet Price</h1>
      <img src="\assets\img\logo.png" alt="Logo" class="logo" />
      <h2 class="subtitle">Inicio de Sesión</h2>
    </ion-label>
  </div>

  <div class="login-card">

    <!-- Paso 1: pedir correo -->
    <div *ngIf="step === 1">
      <ion-input
        id="emailInput"
        class="ion-margin-top"
        label="Correo Electrónico"
        label-placement="floating"
        fill="outline"
        type="email"
        autocomplete="email"
        inputmode="email"
        [(ngModel)]="email"
        [class.is-invalid]="!!emailError"
        [attr.aria-invalid]="emailError ? 'true' : null"
        aria-describedby="emailHelp"
        (ionInput)="onEmailInput()"
        (ionBlur)="emailTouched = true; updateEmailError()">
        <ion-icon slot="start" name="mail-outline"></ion-icon>
      </ion-input>

      <!-- Nota debajo del campo (feedback) -->
      <ion-note id="emailHelp" class="hint" *ngIf="emailError">{{ emailError }}</ion-note>

      <div class="baseBtn">
        <ion-button class="btnPri ion-margin-top" expand="block" (click)="sendResetEmail()">
          Enviar correo para restablecer
        </ion-button>
        <ion-button class="btnSec" expand="block" fill="outline" (click)="goToLogin()">
          Cancelar
        </ion-button>
      </div>
    </div>

    <!-- Paso 2: confirmación -->
    <div *ngIf="step === 2" class="ion-text-center">
      <p>Te enviamos un enlace para restablecer tu contraseña. Revisa tu correo.</p>
      <div class="baseBtn">
        <ion-button class="btnPri" expand="block" (click)="goToLogin()">
          Volver al Login
        </ion-button>
      </div>
    </div>

  </div>

</ion-content>
