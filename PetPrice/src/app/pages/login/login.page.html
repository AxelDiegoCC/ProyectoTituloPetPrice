<ion-content [fullscreen]="true" class="login-page">
  <div class="bg-gradient"></div>

  <!-- WRAPPER CENTRADO -->
  <div class="login-stack">
    <!-- Logo -->
    <div class="logo-wrap">
      <div class="logo-circle">
        <img src="\assets\img\logo.png" alt="Logo" class="logo" />
      </div>
    </div>

    <!-- Títulos -->
    <h1 class="welcome">Bienvenido</h1>
    <p class="subtitle">Compara precios y encuentra las mejores ofertas</p>

    <!-- Tarjeta -->
    <section class="card">
      <!-- ===== Correo ===== -->
      <label class="field-label" for="emailInput">Correo electrónico</label>
      <div class="input">
        <ion-icon name="mail-outline" class="leading"></ion-icon>
        <input
          id="emailInput"
          type="email"
          placeholder="tu@email.com"
          autocomplete="email"
          inputmode="email"
          [(ngModel)]="email"
          (input)="onEmailInput()"
          (blur)="emailTouched = true; updateEmailError()"
          [class.is-invalid]="!!emailError"
          [attr.aria-invalid]="emailError ? 'true' : null"
          aria-describedby="emailHelp"
        />
      </div>
      <small id="emailHelp" class="hint" *ngIf="emailError">{{ emailError }}</small>

      <!-- ===== Contraseña ===== -->
      <label class="field-label" for="passwordInput">Contraseña</label>
      <div class="input">
        <ion-icon name="lock-closed-outline" class="leading"></ion-icon>
        <input
          id="passwordInput"
          [type]="showPassword ? 'text' : 'password'"
          placeholder="••••••"
          autocomplete="current-password"
          autocapitalize="off"
          autocorrect="off"
          [(ngModel)]="password"
          (input)="onPasswordInput()"
          (blur)="passwordTouched = true; updatePasswordError()"
          [class.is-invalid]="!!passwordError"
          [attr.aria-invalid]="passwordError ? 'true' : null"
          aria-describedby="passwordHelp"
        />
        <ion-icon
          class="trailing eye-toggle"
          [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
          (click)="togglePasswordVisibility()"
          tabindex="0"
          role="button"
          aria-label="Mostrar u ocultar contraseña"
        ></ion-icon>
      </div>
      <small id="passwordHelp" class="hint" *ngIf="passwordError">{{ passwordError }}</small>

      <a class="link" (click)="goToChangePassword()">¿Olvidaste tu contraseña?</a>

      <button class="btn-primary" (click)="login()">Ingresar</button>

      <div class="divider"><span class="dot"></span></div>

      <button class="btn-outline" (click)="goToCreateAccount()">Crear cuenta</button>
    </section>

    <!-- Términos -->
    <p class="terms">
      Al continuar, aceptas nuestros <a>Términos de Servicio</a> y <a>Política de Privacidad</a>
    </p>
  </div>
</ion-content>
